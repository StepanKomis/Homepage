services:
  postgres:
    image: postgres:15-alpine
    container_name: homepage-postgres
    environment:
      POSTGRES_USER: homepage
      POSTGRES_PASSWORD: homepage
      POSTGRES_DB: homepage
    volumes:
      - /srv/homepage/db:/var/lib/postgresql/data
    networks:
      - homepage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homepage"]
      interval: 10s
      timeout: 5s
      retries: 3

  app:
    image: homepage:v1.3.0
    container_name: homepage-app
    env_file:
      - /srv/Homepage/.env.vega
    ports:
      - "4200:4200"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - homepage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4200/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  homepage:
    driver: bridge
