version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: homepage
      POSTGRES_PASSWORD: homepage
      POSTGRES_DB: homepage
    ports:
      - "5432:5432"
    volumes:
      - homepage_db:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    image: homepage:v1.1.0
    env_file:
      - .env
    ports:
      - "4200:4200"
    environment:
      DATABASE_URL: "postgres://homepage:homepage@postgres:5432/homepage?sslmode=disable"
      LOG_LEVEL: "info"
      TZ: "Europe/Prague"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  homepage_db:
