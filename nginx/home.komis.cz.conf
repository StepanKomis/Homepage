# nginx vhost for home.komis.cz on VEGA
# Copy to /srv/nginx/conf.d/home.komis.cz.conf on VEGA
# Then: certbot certonly --webroot -w /srv/nginx/certbot/www -d home.komis.cz
# Then: docker exec nginx nginx -t && nginx -s reload

server {
    listen 80;
    server_name home.komis.cz www.home.komis.cz;
    location /.well-known/acme-challenge/ { 
        root /var/www/certbot; 
    }
    location / { 
        return 301 https://$host$request_uri; 
    }
}

server {
    listen 443 ssl http2;
    server_name home.komis.cz www.home.komis.cz;

    ssl_certificate /etc/letsencrypt/live/home.komis.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/home.komis.cz/privkey.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    include /etc/nginx/conf.d/snippets/error-pages.conf;
    client_max_body_size 100m;

    location / {
        proxy_pass http://100.77.76.47:4200;      # bigboi:4200 or jarvis:4200 on Tailscale
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_intercept_errors on;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location /api/ws {
        proxy_pass http://100.77.76.47:4200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
